name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build web assets
        run: |
          npm install
          npm run build
      - name: Create Android project
        run: |
          npx cap init "Vehicle Logs Pro" "com.custom.vehiclelogspro" --web-dir=dist
          npx cap add android
      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VehicleLogsPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
